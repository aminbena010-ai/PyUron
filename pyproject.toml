[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyuron"
version = "1.0.1"
description = "A modular Python-first 2D and 3D game engine."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pato404", email = "amin.bena010@gmail.com" }]
requires-python = ">=3.12"
keywords = ["game-engine", "opengl", "gamedev", "python", "2d", "3d"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
    "pygame-ce>=2.5.0",
    "PyOpenGL>=3.1.7",
    "numpy>=1.26",
    "pyrr>=0.10.3",
]

[project.urls]
Homepage = "https://github.com/aminbena010-ai/PyUron"
Repository = "https://github.com/aminbena010-ai/PyUron"
Issues = "https://github.com/aminbena010-ai/PyUron/issues"
Changelog = "https://github.com/aminbena010-ai/PyUron/blob/main/CHANGELOG.md"

[project.optional-dependencies]
editor = ["PySide6>=6.7"]
dev    = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["pyuron*"]

[tool.pytest.ini_options]
addopts = "-q --no-header"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]
